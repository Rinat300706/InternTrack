<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Application - InternTrack</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="form-container">

        <h1>Edit Application</h1>

        <p class="form-subtitle">
            Update the details or application status.
        </p>


        <form method="POST">


            <div class="form-group">

                <label>Company</label>

                <input
                    type="text"
                    name="company"
                    value="{{ application['company'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Position</label>

                <input
                    type="text"
                    name="position"
                    value="{{ application['position'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    value="{{ application['location'] }}"
                >

            </div>


            <div class="form-group">

                <label>Application Date</label>

                <input
                    type="date"
                    name="application_date"
                    value="{{ application['application_date'] }}"
                >

            </div>


            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option
                        value="Applied"
                        {% if application["status"] == "Applied" %}
                            selected
                        {% endif %}
                    >
                        Applied
                    </option>


                    <option
                        value="Interview"
                        {% if application["status"] == "Interview" %}
                            selected
                        {% endif %}
                    >
                        Interview
                    </option>


                    <option
                        value="Offer"
                        {% if application["status"] == "Offer" %}
                            selected
                        {% endif %}
                    >
                        Offer
                    </option>


                    <option
                        value="Rejected"
                        {% if application["status"] == "Rejected" %}
                            selected
                        {% endif %}
                    >
                        Rejected
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Job URL</label>

                <input
                    type="url"
                    name="job_url"
                    value="{{ application['job_url'] or '' }}"
                >

            </div>


            <div class="form-group">

                <label>Notes</label>

                <textarea name="notes">{{ application["notes"] or "" }}</textarea>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>


                <a
                    href="/"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>

</html>
