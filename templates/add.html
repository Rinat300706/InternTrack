<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Application - InternTrack</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="form-container">

        <h1>Add Application</h1>

        <p class="form-subtitle">
            Add a new internship application to your tracker.
        </p>


        <form method="POST">


            <div class="form-group">

                <label>Company</label>

                <input
                    type="text"
                    name="company"
                    placeholder="e.g. Amazon"
                    required
                >

            </div>


            <div class="form-group">

                <label>Position</label>

                <input
                    type="text"
                    name="position"
                    placeholder="e.g. Software Engineer Intern"
                    required
                >

            </div>


            <div class="form-group">

                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    placeholder="e.g. Dublin"
                >

            </div>


            <div class="form-group">

                <label>Application Date</label>

                <input
                    type="date"
                    name="application_date"
                >

            </div>


            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Offer">
                        Offer
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Job URL</label>

                <input
                    type="url"
                    name="job_url"
                    placeholder="https://..."
                >

            </div>


            <div class="form-group">

                <label>Notes</label>

                <textarea
                    name="notes"
                    placeholder="Interview dates, recruiter details, notes..."
                ></textarea>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add Application
                </button>


                <a
                    href="/"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>


        </form>

    </div>

</body>

</html>
